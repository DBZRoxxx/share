name: Release

# Push a tag like v0.2.0 to build the Windows installer and publish it to
# GitHub Releases. Installed apps pick it up automatically via auto-update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Use the tag as the app version
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version -w @share/desktop

      # electron-builder creates the release as a draft (see electron-builder.yml).
      - name: Build installer and upload it to a draft release
        run: npm run release -w @share/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository variable (Settings → Secrets and variables → Actions → Variables)
          VITE_SHARE_WEB_URL: ${{ vars.SHARE_WEB_URL }}
          # Code signing (Azure Trusted Signing) — uncomment when enabled in electron-builder.yml
          # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # The interface bundle lets installed apps whose main process matches this
      # build update without reinstalling. Publishing only after it is uploaded
      # means no app ever sees latest.yml without hot.json.
      - name: Upload interface update and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" apps/desktop/release-hot/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
