appId: com.dbzroxxx.share
productName: Share
copyright: Copyright © 2026 Ezequiel
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  # Tray and window icons, loaded at runtime by the main process.
  - resources/**/*
  - package.json
  - '!**/*.map'
asarUnpack:
  - '**/*.node'
protocols:
  - name: Share
    schemes:
      - share
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  executableName: Share
  # Code signing is intentionally off for now. To enable it later with Azure
  # Trusted Signing, fill in `azureSignOptions` and set the AZURE_* secrets in CI.
  # azureSignOptions:
  #   publisherName: ...
  #   endpoint: https://eus.codesigning.azure.net
  #   codeSigningAccountName: ...
  #   certificateProfileName: ...
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Share
  artifactName: Share-Setup-${version}.${ext}
  # Longer retry + clearer message when the old version's files are locked.
  include: build/installer.nsh
publish:
  provider: github
  owner: DBZRoxxx
  repo: share
  # Created as a draft; CI uploads the interface bundle (hot.json) and then
  # publishes it, so no installed app sees the release half-uploaded.
  releaseType: draft
electronLanguages:
  - pt-BR
  - en-US
